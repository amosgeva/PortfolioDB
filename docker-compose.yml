# Run `make init` (or copy .env.template to .env) before the first `up` — the
# app services read it.
#
#   docker compose up -d                    postgres + dashboard (:8501) + scheduler
#   docker compose --profile mcp up -d      also the MCP server (:8765)
#   docker compose --profile tools up -d    also pgAdmin (:58080)
#
# Every published port is bound to 127.0.0.1: reachable from this host and
# nowhere else. The dashboard has no login of its own and can change the ledger,
# so reaching it from another machine is something you opt into —
# docs/exposure.md shows the override, and the tunnels and proxies that are
# safer than a LAN bind.
#
# The application image is pulled, not built. To build from source instead —
# what you want when changing the code — add the dev overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml build
#
# or just `make build`, which does that for you.

# Shared by every service running the app image (see app/Dockerfile: one image,
# different commands).
x-app-base: &app-base
  # Defaults to the 1 line rather than :latest — a released build with a revision
  # anyone can resolve, floating forward across patch *and minor* releases but
  # never across a major. The README tells you to pin rather than track latest;
  # this agrees with it. To hold one exact build, set PORTFOLIODB_IMAGE in .env to
  # the patch tag from the release you want. Image tags carry no `v`, unlike the
  # git tags. No patch number is written down here on purpose: the one that used
  # to be went stale in four hours.
  #
  # `:1.0` sat here through 1.1.0 and 1.1.1, which meant a fresh install got the
  # 1.0 line while the README's feature list already described the Markets strip,
  # and `docker compose pull` — the upgrade this file tells you to run — never
  # crossed the minor boundary to fix it. Nothing about that was deliberate: the
  # sentence above it, and the two in the README, all described `:1`. The minor
  # component is the part that must not be written down here.
  image: ${PORTFOLIODB_IMAGE:-ghcr.io/amosgeva/portfoliodb:1}
  restart: unless-stopped
  # The whole .env reaches the container this way — LLM keys, the FD key, the
  # display name, the timezone — so adding a key never means editing compose.
  # `environment:` below wins over anything with the same name in .env, which
  # is how each service blanks the secrets it has no use for (x-not-mine).
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
  # Hardening. The app runs as an unprivileged user (app/Dockerfile) and needs
  # no Linux capability at all, so it gets none, and no-new-privileges stops a
  # setuid binary from handing one back. The root filesystem is read-only: the
  # only places the app writes are its cache (a named volume), /tmp and the
  # user's home (pip --user for `make test`, Streamlit's and yfinance's small
  # per-user state), which are tmpfs and vanish with the container.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
    - /home/appuser:uid=10001,gid=10001,mode=0700

# Secrets in .env that no service built on x-app-base reads: the dashboard and
# the scheduler would otherwise receive them through env_file. Blanking them
# here (environment beats env_file) keeps "a new key needs no compose edit" for
# the keys the app does use, while the ones that belong to another process —
# the MCP server's token and role, pgAdmin's login — stay out of the processes
# that fetch third-party web pages. Empty means unset to every reader.
x-not-mine: &not-mine
  PORTFOLIODB_MCP_TOKEN: ""
  PORTFOLIODB_MCP_RO_PASSWORD: ""
  PGADMIN_PASSWORD: ""
  PGADMIN_EMAIL: ""

# Where the database is. No credentials: the mcp service takes this alone and
# brings its own read-only role.
x-db-target: &db-target
  # Talk to the postgres service over the docker network, not the host port
  # published below (which is what .env's PORTFOLIODB_HOST points at).
  PORTFOLIODB_HOST: postgres
  PORTFOLIODB_PORT: 5432
  PORTFOLIODB_DB: portfoliodb
  TZ: ${PORTFOLIODB_TZ:-UTC}

# The application's own login, for the services that write.
x-app-env: &app-env
  <<: *db-target
  PORTFOLIODB_USER: portfoliouser
  PORTFOLIODB_PASSWORD: ${POSTGRES_PASSWORD}

services:
  postgres:
    # Tag for the reader, digest for the machine: the tag names the release, the
    # digest is what is actually pulled, so a re-pushed tag cannot change the
    # database under you. Dependabot proposes digest and 16.x bumps; it never
    # proposes a new major, which needs pg_upgrade, not a pull.
    image: postgres:16.16@sha256:30551eca978d79ccf49d037bc297b5670baea61a04ceca42ff7fd3100163d3ce
    container_name: portfoliodb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfoliodb
      POSTGRES_USER: portfoliouser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${PORTFOLIODB_TZ:-UTC}
    # The entrypoint starts as root, fixes ownership of the data directory and
    # drops to the postgres user, which takes exactly these five capabilities;
    # everything else Docker grants by default is removed. Not read_only: the
    # Windows runner moves backups in and out with `docker compose cp`, which
    # Docker refuses on a read-only root filesystem and cannot see through a
    # tmpfs (checked 2026-11-15) — see docs/commands.md#backup for why that
    # route is the only safe one on PowerShell 5.1.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # Loopback only, like every port in this file: host tools and host-run
    # Python reach it at 127.0.0.1:54320, and the other services use the compose
    # network regardless. Publishing it to the LAN is an opt-in override.
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      # Named volume, not a ./data bind mount: Docker owns the permissions (a
      # bind mount hits uid mismatches on some hosts), `docker compose down`
      # cannot sweep it away with the project directory, and nothing invites
      # you to open the live data directory in an editor. Prefer a bind mount?
      # Override it — see docker-compose.override.yml.example.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U portfoliouser -d portfoliodb" ]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    <<: *app-base
    container_name: portfoliodb-dashboard
    environment:
      <<: [*app-env, *not-mine]
      # The shared password for the write pages (Manage, Advisor). `make init`
      # generates it. Named here as well as arriving through env_file so the
      # rendered model shows which service holds it — and that no other does.
      PORTFOLIODB_DASHBOARD_PASSWORD: ${PORTFOLIODB_DASHBOARD_PASSWORD:-}
    # From /app/app, mirroring the documented host workflow (run it from app/):
    # the bare module imports resolve without putting app/ ahead of
    # site-packages, which would shadow the `mcp` SDK — see app/Dockerfile.
    # 0.0.0.0 is inside the container's own network namespace; what the host
    # exposes is decided by `ports:` below.
    command: ["sh", "-c", "cd /app/app && streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501"]
    # Loopback only. The dashboard has no login of its own and can add and
    # delete trades; reaching it from another machine is an opt-in override
    # (docs/exposure.md#reaching-it-from-your-lan), or better, a tunnel.
    ports:
      - "127.0.0.1:8501:8501"
    # Streamlit's own liveness endpoint, read with the image's Python (there is
    # no curl in it). `docker compose ps` then says "healthy" only once the
    # server answers, not merely once the process exists.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    volumes:
      # The operator's own philosophy, read-only — the advisor reads it on
      # every call and must never write it. Create it from
      # philosophy.md.template before the first `up`, or Docker will helpfully
      # create a *directory* here instead.
      - ./philosophy.md:/app/philosophy.md:ro
      # Named volume rather than a ./cache bind mount: a bind mount is created
      # root-owned on Linux hosts and the container runs unprivileged, so the
      # Financial-Datasets cache could not be written. Shared with the Phase 4
      # scheduler, which is the only writer.
      - appcache:/app/cache

  # Scheduled jobs (price snapshots, daily brief, weekly enrichment) — see
  # docker/crontab. Replaces the Windows Task Scheduler setup; the market
  # window lives in app/market_window.py, not in the cron lines.
  scheduler:
    <<: *app-base
    container_name: portfoliodb-scheduler
    # Environment scope, decided rather than inherited (audit O-3): the
    # scheduler does need most of .env — the morning brief calls the configured
    # LLM and the weekly enrichment calls Financial Datasets, so those keys stay.
    # What it never reads is blanked: the MCP and pgAdmin secrets (x-not-mine)
    # and the dashboard's write-page password. A key added to .env for the app
    # still arrives without a compose edit.
    environment:
      <<: [*app-env, *not-mine]
      PORTFOLIODB_DASHBOARD_PASSWORD: ""
    # Absolute path, not a bare "supercronic": as PID 1 supercronic re-execs
    # itself to reap zombies, and ForkExec cannot resolve argv[0] through PATH
    # — the bare name crash-loops with "Failed to fork exec: no such file or
    # directory" before any job runs.
    #
    # The metrics listener is on the container's own loopback and not published:
    # it exists for the healthcheck below, which asks supercronic itself whether
    # it is up rather than inferring it from a process list.
    command: ["/usr/local/bin/supercronic", "-passthrough-logs", "-prometheus-listen-address", "127.0.0.1:9746", "/app/docker/crontab"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9746/health', timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 6s
      retries: 3
      start_period: 20s
    volumes:
      - ./philosophy.md:/app/philosophy.md:ro
      - appcache:/app/cache

  # Optional DB browser, behind a profile: it needs PGADMIN_EMAIL/PASSWORD and
  # crash-loops without them, so a fresh clone must not start it by default.
  #   docker compose --profile tools up -d pgadmin
  pgadmin:
    # The current 9.x line, pinned by digest like postgres above. Tag 8 had not
    # been rebuilt since 2024-12.
    image: dpage/pgadmin4:9.19.0@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    container_name: portfoliodb-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      TZ: ${PORTFOLIODB_TZ:-UTC}
      # Both needed for the hardening below. Postfix (password-reset mail, which
      # desktop mode has no use for) is started through sudo, which
      # no-new-privileges forbids; and port 80 needs a file capability that
      # no-new-privileges also refuses, so it listens on 8080 instead. Checked
      # against 9.19.0: with these it starts with an empty capability set.
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_LISTEN_PORT: "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Not read_only: the entrypoint writes its generated config into the image
    # filesystem on every start.
    ports:
      - "127.0.0.1:58080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Optional MCP service, behind a profile because most installs won't want a
  # second network listener:
  #   docker compose --profile mcp up -d mcp
  mcp:
    <<: *app-base
    container_name: portfoliodb-mcp
    profiles: ["mcp"]
    # NOT the whole .env. The base anchor hands every service the entire file —
    # LLM keys, the Financial Datasets key, pgAdmin's login — which is right for
    # the dashboard and the scheduler and wrong for a process whose job is to
    # answer an LLM over the network. This service gets the database, its own
    # settings, and nothing it has no use for. Add a key here when the MCP
    # code starts reading it, not before.
    env_file: []
    environment:
      # The database's address only — not *app-env, so the application's
      # read-write password never reaches this container. The read-only role
      # below is what it connects as. If you set the fallback flag instead,
      # you must also hand it PORTFOLIODB_PASSWORD in docker-compose.override.yml
      # (docs/exposure.md#the-mcp-server shows the block); it refuses to start
      # and says so otherwise.
      <<: *db-target
      PORTFOLIODB_MCP_TOKEN: ${PORTFOLIODB_MCP_TOKEN}
      PORTFOLIODB_MCP_HOST: 0.0.0.0
      PORTFOLIODB_MCP_PORT: 8765
      # The read-only role is required (app/mcp/deps.py); create it with
      # `make ro-role`. The fallback flag is the explicit, logged opt-out.
      PORTFOLIODB_MCP_RO_USER: ${PORTFOLIODB_MCP_RO_USER:-}
      PORTFOLIODB_MCP_RO_PASSWORD: ${PORTFOLIODB_MCP_RO_PASSWORD:-}
      PORTFOLIODB_MCP_ALLOW_RW_FALLBACK: ${PORTFOLIODB_MCP_ALLOW_RW_FALLBACK:-}
      PORTFOLIODB_MCP_LOG_LEVEL: ${PORTFOLIODB_MCP_LOG_LEVEL:-INFO}
      # Host-header names other machines use to reach the server (the guard
      # refuses anything else with 421; loopback is always accepted).
      PORTFOLIODB_MCP_ALLOWED_HOSTS: ${PORTFOLIODB_MCP_ALLOWED_HOSTS:-}
      PORTFOLIODB_BENCHMARK_SYMBOL: ${PORTFOLIODB_BENCHMARK_SYMBOL:-SPY}
      # The reporting timezone, so the server buckets days the way the
      # dashboard does. TZ above is the process clock; this is the setting the
      # code reads when the settings table is out of its reach (audit X-4).
      PORTFOLIODB_TZ: ${PORTFOLIODB_TZ:-}
      PORTFOLIODB_MARKET_START: ${PORTFOLIODB_MARKET_START:-}
      PORTFOLIODB_MARKET_END: ${PORTFOLIODB_MARKET_END:-}
      PORTFOLIODB_MARKET_WEEK: ${PORTFOLIODB_MARKET_WEEK:-}
    command: ["sh", "-c", "uvicorn app.mcp.server:asgi --host ${PORTFOLIODB_MCP_HOST:-0.0.0.0} --port ${PORTFOLIODB_MCP_PORT:-8765}"]
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  appcache:
