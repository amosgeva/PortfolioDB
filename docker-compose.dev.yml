# Overlay for working on the code: builds the application image locally instead
# of pulling it from GHCR. Committed on purpose — contributors need it, and it
# is not machine-specific (that is docker-compose.override.yml).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml build
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# `make build` and `make dev-up` apply it for you.
#
# `image:` is repeated so the locally built image gets a name that cannot be
# confused with a published one — otherwise a later `docker compose pull` would
# happily replace your build with the registry's.

x-build-args: &build-args
  # `make build` passes the local short SHA, so a locally built image still
  # reports what it is instead of "build unknown".
  PORTFOLIODB_VERSION: ${PORTFOLIODB_VERSION:-dev}

# The stack's services run the Dockerfile's `runtime` stage — the one that is
# published, with no pip in it (audit O-2). Named explicitly rather than left
# to "the last stage" so a stage added later cannot silently change it.
x-build: &build
  build:
    context: .
    dockerfile: app/Dockerfile
    target: runtime
    args: *build-args
  image: portfoliodb-app:dev
  pull_policy: never

services:
  dashboard:
    <<: *build
  scheduler:
    <<: *build
  scheduler-llm:
    <<: *build
  mcp:
    <<: *build

  # Build and test tooling: the Dockerfile's `dev` stage, which keeps pip.
  # `make lock` freezes it and `make test` installs pytest into it; nothing
  # else uses it. Behind a profile so `make dev-up` never starts it, and with
  # no env_file: the suites run with a blank database password and need none
  # of .env's secrets. Hardened like the services it stands in for.
  devtools:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: dev
      args: *build-args
    image: portfoliodb-app:devtools
    pull_policy: never
    profiles: ["devtools"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser:uid=10001,gid=10001,mode=0700
