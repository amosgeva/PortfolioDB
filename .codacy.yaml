# Codacy Configuration
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/

# Exclude paths from analysis
exclude_paths:
  # Development/admin scripts - don't run in production, no user input
  - "scripts/**"
  - "examples/**"
  - "docs/**"
  - "sql/**"
  - "Synk/**"
  - "supabase/**"
  - "test-reports/**"
  - "test-results/**"
  - "**/tests/**"
  # Generated by app/dashboard/static/build.mjs from the analysed sources under
  # app/dashboard/static/src (and tokens.css / fonts/*.woff2).
  - "app/dashboard/static/app.js"
  - "app/dashboard/static/app.css"
  - "app/dashboard/static/fonts/fonts.css"

