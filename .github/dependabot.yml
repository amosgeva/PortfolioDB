# The Dockerfile pins its base image by digest and every third-party action is
# pinned to a commit SHA, so nothing moves on its own. That is the point, and
# it has a cost: nothing moves on its own. Dependabot is what proposes the
# moves — a pull request per bump, run through the same CI as any change, so a
# base-image update is a reviewed diff rather than a silent rebuild.
#
# Python packages are deliberately NOT here. The resolution lives in
# app/constraints.txt, generated inside the image (`make lock`); a bot editing
# pins from a different interpreter and platform would produce a lock the image
# does not agree with, and CI would reject it. The weekly scan
# (security-scan.yml) is what says when the lock needs refreshing.
version: 2
updates:
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(image)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
