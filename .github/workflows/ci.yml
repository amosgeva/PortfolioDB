name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable so publish.yml can gate on a real test run instead of repeating
  # these steps and drifting from them.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Keyed on the calling workflow too: a publish run must not cancel the CI run
  # for the same ref (they share github.ref).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast suites need no database: everything DB-touching is either stubbed
  # or guarded by a skip. Proving that on a runner with no Postgres is the point
  # — it is what keeps `make test` working on a fresh install.
  tests:
    name: Test suites (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest

      - name: Engines, settings, market window (from app/)
        working-directory: app
        run: python -m pytest tests/ -q

      # From the repo root, NOT app/: on the path as app/, the local app/mcp/
      # package shadows the installed `mcp` SDK that fastmcp imports.
      #
      # Also a separate step from the slow suite below, deliberately: running
      # both in one pytest process fails four reconciliation tests through
      # cross-test state. Two invocations, no interference.
      - name: MCP suite (fast)
        run: python -m pytest app/mcp/tests/ -m "not slow" -q

      # The drift guard's own adversarial cases. This runs on pull_request,
      # unlike the guard itself: the cases are pure functions over markup with
      # no network in them, so they cannot redden a build because the site or
      # Cloudflare had a moment. Only `public-surface-drift.yml` touches the
      # network, and only on a schedule.
      - name: Drift guard cases (no network)
        run: python -m pytest tools/tests/ -q

      # Hand-maintained counts in prose went stale three times in 24 hours, so
      # instead of maintaining them we assert that none exist. Any "NNN tests"
      # claim in a tracked markdown file fails here — the vaguer true statement
      # beats the precise one that rots.
      # Scoped to what strangers read. docs/internal/ is excluded on purpose: it
      # is a dated record of past work, where "16 tests on the engine" was true
      # when written and is not a claim about today. CHANGELOG entries are the
      # same — versioned facts, not live prose.
      - name: No hand-maintained test counts in public docs
        run: |
          if git grep -nE '[0-9]{2,} tests?\b' -- 'README.md' 'docs/*.md' ':!docs/internal'; then
            echo "::error::Remove the literal test count above, or describe the suite instead."
            exit 1
          fi
          echo "no literal test counts in public prose"

      # Same failure as the test counts, one release later: a patch tag written by
      # hand into prose. `:1.0.1` sat in the README as the "pin harder" example
      # while 1.0.3 shipped the reviewed disclaimer — so a reader following our own
      # advice literally got an image without it. The docs name the floating `:1`
      # and point at the releases page for an exact build; CHANGELOG and
      # server.json are exempt because there an exact version is the whole point.
      #
      # The minor component is now caught too, because it rots the same way and
      # takes longer to notice: `:1.0` survived 1.1.0 and 1.1.1 in compose while
      # the README's feature list described a 1.1 feature, and the upgrade command
      # this repo prints — `docker compose pull` — cannot cross a minor boundary,
      # so nobody who installed it would ever have been moved off.
      - name: No hand-written minor or patch pins in the docs or compose
        run: |
          if git grep -nE 'portfoliodb:[0-9]+\.[0-9]+' -- \
               'README.md' 'docs/*.md' 'docker-compose*.yml' '.env.template' '.github' \
               ':!docs/internal'; then
            echo "::error::Name the floating :1 instead, or link the releases page."
            exit 1
          fi
          echo "no hand-written patch pins outside CHANGELOG/server.json"

  # The reconciliation suite runs the real services against a real database, so
  # it gets one: schema, migrations, and the fictional demo ledger.
  reconciliation:
    name: Reconciliation (live database)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfoliodb
          POSTGRES_USER: portfoliouser
          POSTGRES_PASSWORD: ci-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfoliouser -d portfoliodb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORTFOLIODB_HOST: 127.0.0.1
      PORTFOLIODB_PORT: '5432'
      PORTFOLIODB_DB: portfoliodb
      PORTFOLIODB_USER: portfoliouser
      PORTFOLIODB_PASSWORD: ci-not-a-secret
      # Pin the reporting timezone so day-bucketing is deterministic whatever
      # the runner's clock is set to.
      PORTFOLIODB_TZ: UTC

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest

      - name: Apply schema and migrations
        run: |
          psql -q -f sql/schema.sql
          psql -q -f sql/schema_fd.sql
          for f in sql/migrations/*.sql; do echo "applying $f"; psql -q -f "$f"; done
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: portfoliodb
          PGUSER: portfoliouser
          PGPASSWORD: ci-not-a-secret

      - name: Seed the fictional demo ledger
        run: python app/demo_seed.py --yes

      - name: Reconciliation suite
        run: python -m pytest app/mcp/tests/ -m slow -q

  # pdb.ps1 is the Windows runner, and until this job existed nothing on a
  # Linux-only CI could tell whether it still parsed, let alone worked. It is
  # split in two on purpose, because of one hard constraint:
  #
  #   GitHub-hosted windows-latest runners cannot run Linux containers.
  #
  # Docker there is in Windows-container mode and `services:` is unsupported, so
  # the obvious "drive the wrapper against a real stack on Windows" job is not
  # available at any price. Instead:
  #
  #   wrapper-windows  the real Windows hosts, no Docker  -> init, parse, lint
  #   wrapper-live     real Docker, no Windows            -> backup/restore
  #
  # Neither is sufficient alone. Together they cover the script.
  wrapper-windows:
    name: Windows runner (init, both PowerShell hosts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Pester 5 is not a given: the runner images have carried 3.4.0, whose
      # syntax is incompatible, and this box did too. Install explicitly rather
      # than hope, and pin the major so a v6 cannot land here unannounced.
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck

      - name: Lint
        shell: pwsh
        run: |
          $found = @()
          foreach ($f in @('pdb.ps1', 'tools/tests/pdb.Tests.ps1')) {
            $found += Invoke-ScriptAnalyzer -Path $f -Settings PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
          }
          if ($found) {
            $found | ForEach-Object { Write-Host "::error file=$($_.ScriptName),line=$($_.Line)::$($_.RuleName): $($_.Message)" }
            exit 1
          }
          Write-Host 'PSScriptAnalyzer clean'

      # A fresh Windows box has Windows PowerShell 5.1, so 5.1 is the host that
      # actually matters; 7 is what a developer is likely to be testing in. The
      # suite runs under both because the two disagree in ways that bite:
      # 5.1 reads a BOM-less .ps1 as the system codepage (an em-dash in output
      # became mojibake), and cannot parse ??, ?. or a ternary at all.
      #
      # Pester itself always runs under pwsh; PDB_PS_HOST picks the host that
      # the script under test is launched with.
      - name: Pester under Windows PowerShell 5.1
        shell: pwsh
        env:
          PDB_PS_HOST: powershell.exe
        run: |
          $r = Invoke-Pester -Path tools/tests/pdb.Tests.ps1 -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Pester under PowerShell 7
        shell: pwsh
        env:
          PDB_PS_HOST: pwsh
        run: |
          $r = Invoke-Pester -Path tools/tests/pdb.Tests.ps1 -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { exit 1 }

  # The half windows-latest cannot do: drive pdb.ps1's backup and restore
  # against a real Postgres container. pwsh is preinstalled on the Ubuntu runner
  # images, so this exercises the script's actual command construction rather
  # than a reimplementation of it.
  #
  # Only the postgres service is started. backup and restore touch nothing else,
  # and skipping the app image keeps the job to seconds and independent of
  # whether a published image happens to be pullable.
  wrapper-live:
    name: Windows runner (backup/restore round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Also the first real test of init: everything after it needs the .env it
      # writes, because compose declares `env_file: .env` and hard-errors
      # without it.
      - name: init writes a usable .env
        shell: pwsh
        run: |
          ./pdb.ps1 init
          if (-not (Test-Path .env)) { throw '.env was not created' }
          $pg = (Select-String -Path .env -Pattern '^POSTGRES_PASSWORD=(.+)$').Matches.Groups[1].Value
          $app = (Select-String -Path .env -Pattern '^PORTFOLIODB_PASSWORD=(.+)$').Matches.Groups[1].Value
          if ($pg -ne $app) { throw 'init left the two passwords different' }
          # A UTF-16 or BOM'd .env is unreadable to Compose, which reports the
          # variables as unset rather than as malformed.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .env))
          if ($bytes[0] -eq 0xEF -or $bytes[0] -eq 0xFF -or $bytes[0] -eq 0xFE) { throw '.env has a BOM' }

      - name: Start postgres
        run: docker compose up -d --wait postgres

      - name: Seed a ledger
        run: |
          docker compose exec -T postgres psql -q -U portfoliouser -d portfoliodb -c "
            CREATE TABLE lots (id serial primary key, symbol text, quantity numeric, price numeric);
            INSERT INTO lots (symbol, quantity, price)
              SELECT 'NVDA', g, 100 + g FROM generate_series(1, 7) g;"

      - name: Back it up
        shell: pwsh
        run: ./pdb.ps1 backup

      # The assertion the whole Windows backup design exists for. `pg_dump |
      # gzip > file` is right on POSIX and wrong on Windows -- there is no host
      # gzip, and 5.1 re-encodes a native command's binary output on
      # redirection. The same dump measured 5.6 MB and unreadable that way
      # against 2.9 MB and valid. Nothing warns you until you restore, so the
      # test is `gzip -t`, not "a file appeared".
      - name: The dump must be a valid gzip
        run: |
          dump=$(ls backups/portfoliodb-*.sql.gz | head -1)
          test -s "$dump" || { echo "::error::backup produced an empty file"; exit 1; }
          gzip -t "$dump" || { echo "::error::backup produced a CORRUPT gzip"; exit 1; }
          gunzip -c "$dump" | grep -q 'CREATE TABLE public.lots' \
            || { echo "::error::dump has no lots table in it"; exit 1; }
          echo "valid gzip: $dump ($(du -h "$dump" | cut -f1))"

      - name: Restore must refuse a non-empty database
        shell: pwsh
        run: |
          $dump = (Get-ChildItem backups -Filter '*.sql.gz')[0].FullName
          ./pdb.ps1 restore $dump
          # Refusing is the correct outcome, so a zero exit code is the failure.
          if ($LASTEXITCODE -eq 0) { throw 'restore overwrote a live database' }
          Write-Host 'restore correctly refused a non-empty database'
          # Explicit, because the expected $LASTEXITCODE here is 1: leaving it
          # dangling at the end of the block invites the step to report the
          # refusal we just asked for as a failure.
          exit 0

      - name: Wipe, then restore for real
        run: |
          docker compose exec -T postgres psql -q -U portfoliouser -d portfoliodb \
            -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Round trip must return the same rows
        shell: pwsh
        run: |
          $dump = (Get-ChildItem backups -Filter '*.sql.gz')[0].FullName
          ./pdb.ps1 restore $dump
          if ($LASTEXITCODE -ne 0) { throw 'restore failed' }
          $n = (docker compose exec -T postgres psql -tAc 'SELECT count(*) FROM lots' -U portfoliouser -d portfoliodb | Out-String).Trim()
          if ($n -ne '7') { throw "expected 7 lots after restore, got '$n'" }
          Write-Host "round trip clean: $n lots restored"

      - name: Stop the stack
        if: always()
        run: docker compose down -v
