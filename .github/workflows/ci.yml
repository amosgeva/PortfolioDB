name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable so publish.yml can gate on a real test run instead of repeating
  # these steps and drifting from them.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Keyed on the calling workflow too: a publish run must not cancel the CI run
  # for the same ref (they share github.ref).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast suites need no database: everything DB-touching is either stubbed
  # or guarded by a skip. Proving that on a runner with no Postgres is the point
  # — it is what keeps `make test` working on a fresh install.
  tests:
    name: Test suites (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest

      - name: Engines, settings, market window (from app/)
        working-directory: app
        run: python -m pytest tests/ -q

      # From the repo root, NOT app/: on the path as app/, the local app/mcp/
      # package shadows the installed `mcp` SDK that fastmcp imports.
      #
      # Also a separate step from the slow suite below, deliberately: running
      # both in one pytest process fails four reconciliation tests through
      # cross-test state. Two invocations, no interference.
      - name: MCP suite (fast)
        run: python -m pytest app/mcp/tests/ -m "not slow" -q

      # The drift guard's own adversarial cases. This runs on pull_request,
      # unlike the guard itself: the cases are pure functions over markup with
      # no network in them, so they cannot redden a build because the site or
      # Cloudflare had a moment. Only `public-surface-drift.yml` touches the
      # network, and only on a schedule.
      - name: Drift guard cases (no network)
        run: python -m pytest tools/tests/ -q

      # Hand-maintained counts in prose went stale three times in 24 hours, so
      # instead of maintaining them we assert that none exist. Any "NNN tests"
      # claim in a tracked markdown file fails here — the vaguer true statement
      # beats the precise one that rots.
      # Scoped to what strangers read. docs/internal/ is excluded on purpose: it
      # is a dated record of past work, where "16 tests on the engine" was true
      # when written and is not a claim about today. CHANGELOG entries are the
      # same — versioned facts, not live prose.
      - name: No hand-maintained test counts in public docs
        run: |
          if git grep -nE '[0-9]{2,} tests?\b' -- 'README.md' 'docs/*.md' ':!docs/internal'; then
            echo "::error::Remove the literal test count above, or describe the suite instead."
            exit 1
          fi
          echo "no literal test counts in public prose"

      # Same failure as the test counts, one release later: a patch tag written by
      # hand into prose. `:1.0.1` sat in the README as the "pin harder" example
      # while 1.0.3 shipped the reviewed disclaimer — so a reader following our own
      # advice literally got an image without it. The docs name the floating `:1`
      # and point at the releases page for an exact build; CHANGELOG and
      # server.json are exempt because there an exact version is the whole point.
      #
      # The minor component is now caught too, because it rots the same way and
      # takes longer to notice: `:1.0` survived 1.1.0 and 1.1.1 in compose while
      # the README's feature list described a 1.1 feature, and the upgrade command
      # this repo prints — `docker compose pull` — cannot cross a minor boundary,
      # so nobody who installed it would ever have been moved off.
      - name: No hand-written minor or patch pins in the docs or compose
        run: |
          if git grep -nE 'portfoliodb:[0-9]+\.[0-9]+' -- \
               'README.md' 'docs/*.md' 'docker-compose*.yml' '.env.template' '.github' \
               ':!docs/internal'; then
            echo "::error::Name the floating :1 instead, or link the releases page."
            exit 1
          fi
          echo "no hand-written patch pins outside CHANGELOG/server.json"

  # The reconciliation suite runs the real services against a real database, so
  # it gets one: schema, migrations, and the fictional demo ledger.
  reconciliation:
    name: Reconciliation (live database)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfoliodb
          POSTGRES_USER: portfoliouser
          POSTGRES_PASSWORD: ci-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfoliouser -d portfoliodb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORTFOLIODB_HOST: 127.0.0.1
      PORTFOLIODB_PORT: '5432'
      PORTFOLIODB_DB: portfoliodb
      PORTFOLIODB_USER: portfoliouser
      PORTFOLIODB_PASSWORD: ci-not-a-secret
      # Pin the reporting timezone so day-bucketing is deterministic whatever
      # the runner's clock is set to.
      PORTFOLIODB_TZ: UTC

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest

      - name: Apply schema and migrations
        run: |
          psql -q -f sql/schema.sql
          psql -q -f sql/schema_fd.sql
          for f in sql/migrations/*.sql; do echo "applying $f"; psql -q -f "$f"; done
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: portfoliodb
          PGUSER: portfoliouser
          PGPASSWORD: ci-not-a-secret

      - name: Seed the fictional demo ledger
        run: python app/demo_seed.py --yes

      # The MCP pool requires the read-only role (app/mcp/deps.py), so the
      # suite below runs the way an install does: role created by the same
      # script an operator runs, credentials taken from the two lines it
      # prints. This is also the only place create_ro_role.py is exercised.
      # The password is a throwaway for this job's database and still stays
      # out of the log.
      - name: Create the read-only MCP role
        run: |
          python app/create_ro_role.py --generate > ro-role.out
          grep -E '^PORTFOLIODB_MCP_RO_(USER|PASSWORD)=' ro-role.out >> "$GITHUB_ENV"
          grep -E '^PORTFOLIODB_MCP_RO_USER=' ro-role.out
          rm ro-role.out

      - name: Reconciliation suite
        run: python -m pytest app/mcp/tests/ -m slow -q

  # Until this job existed, nothing in CI ever built app/Dockerfile — so a
  # Dockerfile-only PR passed every check without anyone learning whether the
  # image still built. Not hypothetical: PR #65, a bot's base-image "fix"
  # swapping Debian for Alpine, went green on all seven checks while
  # `docker build` died on line 35 with `apt-get: not found`.
  #
  # The other two Docker-touching jobs cannot catch it. `reconciliation` only
  # starts the `postgres` service, and `make test` runs against the *pulled*
  # image — docker-compose.yml declares `image:`, not `build:`, so the tree's
  # own Dockerfile is never consulted. publish.yml does build it, but only on a
  # release tag, which is after merge.
  #
  # Building is necessary and not sufficient: a base-image change can build
  # cleanly and still ship an interpreter the pins have no wheels for. So the
  # suites run *inside* the image as well, which is what actually proves the
  # dependency set resolved on whatever `FROM` now names.
  #
  # amd64 only. The one arch-sensitive line is the supercronic SHA `case`, and
  # covering arm64 here would mean QEMU plus an emulated pip install on every
  # PR; publish.yml builds both platforms at release. If that trade stops
  # looking right, add `docker/setup-qemu-action` and a matrix.
  image:
    name: Application image (build and self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A clean checkout has no secrets in it, which is exactly why this job
      # could never notice the gap it is now guarding: `.dockerignore` named the
      # root `.env` and nothing else, while the Dockerfile COPYs all of app/.
      # An operator building from a populated working tree had app/.env — the
      # database password, the MCP token, a vendor API key — one build away
      # from an image. Plant obvious fakes where the real sidecars live, then
      # prove below that none of them reached a layer.
      - name: Plant secret canaries where an operator's sidecars would be
        run: |
          echo 'CANARY_SECRET_ROOT=not-a-real-secret' > .env
          echo 'CANARY_SECRET_ROOT_BAK=not-a-real-secret' > .env.bak-20260909
          echo 'CANARY_SECRET_APP=not-a-real-secret' > app/.env
          echo 'CANARY_SECRET_APP_BAK=not-a-real-secret' > app/.env.bak
          mkdir -p app/dashboard/static/logos docs/internal backups
          echo 'CANARY_SECRET_LOGO' > app/dashboard/static/logos/CANARY.png
          echo 'CANARY_SECRET_INTERNAL' > docs/internal/CANARY.local.md
          echo 'CANARY_SECRET_BACKUP' > backups/CANARY.sql.gz

      # Plain `docker build`, deliberately: the runner already has BuildKit, and
      # this way one build needs no third-party action pinned and audited.
      - name: Build the image
        run: docker build -f app/Dockerfile -t portfoliodb-ci:${{ github.sha }} .

      # grep the *filesystem* of the built image, not the build log: a file that
      # is in the context but never COPYd is harmless, one that landed in a
      # layer is the leak. `-r /app` covers every COPY destination.
      - name: No canary reached an image layer
        run: |
          if docker run --rm portfoliodb-ci:${{ github.sha }} grep -rl CANARY_SECRET /app; then
            echo "::error::a gitignored secret sidecar was baked into the image — fix .dockerignore"
            exit 1
          fi
          echo "no canary in the image"

      # The same two invocations `make test` uses, split for the same reason:
      # run both in one pytest process and four reconciliation tests fail on
      # cross-test state. The MCP suite runs from /app, never /app/app — there
      # the local app/mcp/ package lands on the path as top-level `mcp` and
      # shadows the SDK that fastmcp imports.
      - name: Test suites inside the image
        run: |
          docker run --rm portfoliodb-ci:${{ github.sha }} sh -c '
            pip install --user --quiet pytest &&
            export PATH=$PATH:/home/appuser/.local/bin &&
            echo "-- app suite --" && cd /app/app && python -m pytest tests/ -q &&
            echo "-- MCP suite --" && cd /app && python -m pytest app/mcp/tests/ -m "not slow" -q'

      # Every dependency must *import*, not merely install. This is the check
      # that fails loudly on a base image the pins have no wheels for, and the
      # `mcp` entry doubles as the shadowing guard: it resolves to the installed
      # SDK only because PYTHONPATH is /app and the package lives at /app/app.
      - name: Every dependency imports
        run: |
          docker run --rm portfoliodb-ci:${{ github.sha }} python -c '
          import importlib, sys
          bad = []
          for m in ["psycopg2", "pandas", "yfinance", "dotenv", "streamlit",
                    "dateutil", "plotly", "anthropic", "openai", "fastmcp",
                    "uvicorn", "mcp"]:
              try:
                  importlib.import_module(m)
              except Exception as exc:
                  bad.append(f"{m}: {exc}")
          print(sys.version)
          for line in bad:
              print("::error::dependency failed to import:", line)
          sys.exit(1 if bad else 0)'

      # The scheduler's two silent-at-runtime failure modes: a supercronic that
      # did not land where the compose command looks for it, and a crontab it
      # will refuse to start on. `-test` exits non-zero on an invalid one.
      - name: Scheduler entrypoint and crontab
        run: |
          docker run --rm portfoliodb-ci:${{ github.sha }} \
            /usr/local/bin/supercronic -test /app/docker/crontab

  # pdb.ps1 is the Windows runner, and until this job existed nothing on a
  # Linux-only CI could tell whether it still parsed, let alone worked. It is
  # split in two on purpose, because of one hard constraint:
  #
  #   GitHub-hosted windows-latest runners cannot run Linux containers.
  #
  # Docker there is in Windows-container mode and `services:` is unsupported, so
  # the obvious "drive the wrapper against a real stack on Windows" job is not
  # available at any price. Instead:
  #
  #   wrapper-windows  the real Windows hosts, no Docker  -> init, parse, lint
  #   wrapper-live     real Docker, no Windows            -> backup/restore
  #
  # Neither is sufficient alone. Together they cover the script.
  wrapper-windows:
    name: Windows runner (init, both PowerShell hosts)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Pester 5 is not a given: the runner images have carried 3.4.0, whose
      # syntax is incompatible, and this box did too. Install explicitly rather
      # than hope, and pin the major so a v6 cannot land here unannounced.
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck

      - name: Lint
        shell: pwsh
        run: |
          $found = @()
          foreach ($f in @('pdb.ps1', 'tools/tests/pdb.Tests.ps1')) {
            $found += Invoke-ScriptAnalyzer -Path $f -Settings PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
          }
          if ($found) {
            $found | ForEach-Object { Write-Host "::error file=$($_.ScriptName),line=$($_.Line)::$($_.RuleName): $($_.Message)" }
            exit 1
          }
          Write-Host 'PSScriptAnalyzer clean'

      # A fresh Windows box has Windows PowerShell 5.1, so 5.1 is the host that
      # actually matters; 7 is what a developer is likely to be testing in. The
      # suite runs under both because the two disagree in ways that bite:
      # 5.1 reads a BOM-less .ps1 as the system codepage (an em-dash in output
      # became mojibake), and cannot parse ??, ?. or a ternary at all.
      #
      # Pester itself always runs under pwsh; PDB_PS_HOST picks the host that
      # the script under test is launched with.
      - name: Pester under Windows PowerShell 5.1
        shell: pwsh
        env:
          PDB_PS_HOST: powershell.exe
        run: |
          $r = Invoke-Pester -Path tools/tests/pdb.Tests.ps1 -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Pester under PowerShell 7
        shell: pwsh
        env:
          PDB_PS_HOST: pwsh
        run: |
          $r = Invoke-Pester -Path tools/tests/pdb.Tests.ps1 -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { exit 1 }

  # The half windows-latest cannot do: drive pdb.ps1's backup and restore
  # against a real Postgres container. pwsh is preinstalled on the Ubuntu runner
  # images, so this exercises the script's actual command construction rather
  # than a reimplementation of it.
  #
  # Only the postgres service is started. backup and restore touch nothing else,
  # and skipping the app image keeps the job to seconds and independent of
  # whether a published image happens to be pullable.
  wrapper-live:
    name: Windows runner (backup/restore round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Also the first real test of init: everything after it needs the .env it
      # writes, because compose declares `env_file: .env` and hard-errors
      # without it.
      - name: init writes a usable .env
        shell: pwsh
        run: |
          ./pdb.ps1 init
          if (-not (Test-Path .env)) { throw '.env was not created' }
          $pg = (Select-String -Path .env -Pattern '^POSTGRES_PASSWORD=(.+)$').Matches.Groups[1].Value
          $app = (Select-String -Path .env -Pattern '^PORTFOLIODB_PASSWORD=(.+)$').Matches.Groups[1].Value
          if ($pg -ne $app) { throw 'init left the two passwords different' }
          # A UTF-16 or BOM'd .env is unreadable to Compose, which reports the
          # variables as unset rather than as malformed.
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .env))
          if ($bytes[0] -eq 0xEF -or $bytes[0] -eq 0xFF -or $bytes[0] -eq 0xFE) { throw '.env has a BOM' }

      - name: Start postgres
        run: docker compose up -d --wait postgres

      - name: Seed a ledger
        run: |
          docker compose exec -T postgres psql -q -U portfoliouser -d portfoliodb -c "
            CREATE TABLE lots (id serial primary key, symbol text, quantity numeric, price numeric);
            INSERT INTO lots (symbol, quantity, price)
              SELECT 'NVDA', g, 100 + g FROM generate_series(1, 7) g;"

      - name: Back it up
        shell: pwsh
        run: ./pdb.ps1 backup

      # The assertion the whole Windows backup design exists for. `pg_dump |
      # gzip > file` is right on POSIX and wrong on Windows -- there is no host
      # gzip, and 5.1 re-encodes a native command's binary output on
      # redirection. The same dump measured 5.6 MB and unreadable that way
      # against 2.9 MB and valid. Nothing warns you until you restore, so the
      # test is `gzip -t`, not "a file appeared".
      - name: The dump must be a valid gzip
        run: |
          dump=$(ls backups/portfoliodb-*.sql.gz | head -1)
          test -s "$dump" || { echo "::error::backup produced an empty file"; exit 1; }
          gzip -t "$dump" || { echo "::error::backup produced a CORRUPT gzip"; exit 1; }
          gunzip -c "$dump" | grep -q 'CREATE TABLE public.lots' \
            || { echo "::error::dump has no lots table in it"; exit 1; }
          echo "valid gzip: $dump ($(du -h "$dump" | cut -f1))"

      - name: Restore must refuse a non-empty database
        shell: pwsh
        run: |
          $dump = (Get-ChildItem backups -Filter '*.sql.gz')[0].FullName
          ./pdb.ps1 restore $dump
          # Refusing is the correct outcome, so a zero exit code is the failure.
          if ($LASTEXITCODE -eq 0) { throw 'restore overwrote a live database' }
          Write-Host 'restore correctly refused a non-empty database'
          # Explicit, because the expected $LASTEXITCODE here is 1: leaving it
          # dangling at the end of the block invites the step to report the
          # refusal we just asked for as a failure.
          exit 0

      - name: Wipe, then restore for real
        run: |
          docker compose exec -T postgres psql -q -U portfoliouser -d portfoliodb \
            -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Round trip must return the same rows
        shell: pwsh
        run: |
          $dump = (Get-ChildItem backups -Filter '*.sql.gz')[0].FullName
          ./pdb.ps1 restore $dump
          if ($LASTEXITCODE -ne 0) { throw 'restore failed' }
          $n = (docker compose exec -T postgres psql -tAc 'SELECT count(*) FROM lots' -U portfoliouser -d portfoliodb | Out-String).Trim()
          if ($n -ne '7') { throw "expected 7 lots after restore, got '$n'" }
          Write-Host "round trip clean: $n lots restored"

      # ---- Failure injection -------------------------------------------------
      # Everything above is the happy path, and the happy path is what hid the
      # defect: a pipeline's exit status is its last command's, so a pg_dump that
      # died still produced a valid, non-empty gzip of nothing, and `psql` kept
      # going after a SQL error and exited 0. Each step below makes one stage
      # fail and asserts the runner says so — no file, no "restored", nonzero.
      #
      # The fake pg_dump goes in /usr/local/bin, which precedes /usr/bin on the
      # image's PATH, and `exec` runs as root there. Removed again after each use.
      #
      # The runner is started as a child `pwsh -File`, not dot-invoked: it
      # reports these failures with `throw`, and an uncaught throw from an
      # invoked script terminates the *calling* step too — which would fail the
      # step for the very failure it is asserting. A child process turns the
      # throw into exit code 1, which is also how a scheduled task sees it.

      - name: Backup must fail, and keep nothing, when pg_dump fails
        shell: pwsh
        run: |
          docker compose exec -T postgres sh -c "printf '#!/bin/sh\nexit 7\n' > /usr/local/bin/pg_dump && chmod +x /usr/local/bin/pg_dump"
          $before = (Get-ChildItem backups -Filter '*.sql.gz*').Count
          pwsh -NoProfile -File ./pdb.ps1 backup
          $code = $LASTEXITCODE
          docker compose exec -T postgres rm -f /usr/local/bin/pg_dump
          if ($code -eq 0) { throw 'backup reported success although pg_dump exited 7' }
          $after = (Get-ChildItem backups -Filter '*.sql.gz*').Count
          if ($after -ne $before) { throw "a failed backup left a file behind ($before -> $after)" }
          Write-Host "backup correctly failed (exit $code) and kept nothing"
          exit 0

      - name: Backup must fail on a dump that never finished
        shell: pwsh
        run: |
          # A producer that exits 0 with partial output: valid gzip, no completion
          # marker. This is what a pg_dump killed mid-way looks like.
          docker compose exec -T postgres sh -c "printf '#!/bin/sh\necho -- partial dump\n' > /usr/local/bin/pg_dump && chmod +x /usr/local/bin/pg_dump"
          $before = (Get-ChildItem backups -Filter '*.sql.gz*').Count
          pwsh -NoProfile -File ./pdb.ps1 backup
          $code = $LASTEXITCODE
          docker compose exec -T postgres rm -f /usr/local/bin/pg_dump
          if ($code -eq 0) { throw 'backup accepted a dump with no completion marker' }
          $after = (Get-ChildItem backups -Filter '*.sql.gz*').Count
          if ($after -ne $before) { throw "an incomplete backup left a file behind ($before -> $after)" }
          Write-Host "incomplete dump correctly rejected (exit $code)"
          exit 0

      - name: Restore must reject a truncated archive before touching the database
        shell: pwsh
        run: |
          docker compose exec -T postgres psql -q -U portfoliouser -d portfoliodb -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          $good = (Get-ChildItem backups -Filter 'portfoliodb-*.sql.gz')[0].FullName
          $bytes = [System.IO.File]::ReadAllBytes($good)
          [System.IO.File]::WriteAllBytes('truncated.sql.gz', $bytes[0..199])
          pwsh -NoProfile -File ./pdb.ps1 restore truncated.sql.gz
          if ($LASTEXITCODE -eq 0) { throw 'restore accepted a truncated gzip' }
          $n = (docker compose exec -T postgres psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" -U portfoliouser -d portfoliodb | Out-String).Trim()
          if ($n -ne '0') { throw "truncated restore left $n table(s) behind" }
          Write-Host 'truncated archive correctly rejected, database untouched'
          exit 0

      - name: Restore must stop at a SQL error and leave the database empty
        shell: pwsh
        run: |
          # A valid archive whose SQL fails after the lots table exists — the
          # case the old runner reported as "restored" with a lots count.
          $sql = "CREATE TABLE lots (id int);`nINSERT INTO lots VALUES (1), (2);`nSELECT 1/0;`nCREATE TABLE after_the_error (id int);`n"
          [System.IO.File]::WriteAllText('bad.sql', $sql)
          docker compose cp bad.sql postgres:/tmp/bad.sql
          docker compose exec -T postgres sh -c 'gzip -c /tmp/bad.sql > /tmp/bad.sql.gz'
          docker compose cp postgres:/tmp/bad.sql.gz bad.sql.gz
          pwsh -NoProfile -File ./pdb.ps1 restore bad.sql.gz
          if ($LASTEXITCODE -eq 0) { throw 'restore reported success although the SQL failed halfway' }
          $n = (docker compose exec -T postgres psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" -U portfoliouser -d portfoliodb | Out-String).Trim()
          if ($n -ne '0') { throw "a failed restore left $n table(s) behind instead of rolling back" }
          Write-Host 'SQL error correctly stopped the restore and rolled back'
          exit 0

      # ---- The Makefile is the other runner, and it had the same two defects.
      # Ubuntu has make and gzip, so the same scenarios run against it here. The
      # database is empty at this point (the failed restores above rolled back).

      - name: make restore must stop at a SQL error and leave the database empty
        run: |
          if make restore ARGS=bad.sql.gz; then
            echo "::error::make restore reported success although the SQL failed halfway"; exit 1
          fi
          n=$(docker compose exec -T postgres psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" -U portfoliouser -d portfoliodb | tr -d '[:space:]')
          test "$n" = "0" || { echo "::error::a failed make restore left $n table(s) behind"; exit 1; }
          if make restore ARGS=truncated.sql.gz; then
            echo "::error::make restore accepted a truncated gzip"; exit 1
          fi
          echo "make restore correctly failed on both bad archives"

      - name: make restore round trip
        run: |
          dump=$(ls backups/portfoliodb-*.sql.gz | head -1)
          make restore ARGS="$dump"
          n=$(docker compose exec -T postgres psql -tAc 'SELECT count(*) FROM lots' -U portfoliouser -d portfoliodb | tr -d '[:space:]')
          test "$n" = "7" || { echo "::error::expected 7 lots after make restore, got '$n'"; exit 1; }
          echo "make round trip clean: $n lots restored"

      - name: make backup produces a verified archive
        run: |
          make backup
          dump=$(ls -t backups/portfoliodb-*.sql.gz | head -1)
          gzip -t "$dump"
          gunzip -c "$dump" | grep -q 'CREATE TABLE public.lots' || { echo "::error::make backup dump has no lots table"; exit 1; }
          test -z "$(ls backups/*.part 2>/dev/null)" || { echo "::error::a .part file survived a successful backup"; exit 1; }
          echo "make backup ok: $dump"

      - name: make backup must fail, and keep nothing, when pg_dump fails
        run: |
          docker compose exec -T postgres sh -c 'printf "#!/bin/sh\nexit 7\n" > /usr/local/bin/pg_dump && chmod +x /usr/local/bin/pg_dump'
          before=$(ls backups | wc -l)
          if make backup; then
            docker compose exec -T postgres rm -f /usr/local/bin/pg_dump
            echo "::error::make backup succeeded although pg_dump exited 7"; exit 1
          fi
          docker compose exec -T postgres rm -f /usr/local/bin/pg_dump
          after=$(ls backups | wc -l)
          test "$before" = "$after" || { echo "::error::a failed make backup left a file behind"; exit 1; }
          echo "make backup correctly failed and kept nothing"

      - name: make backup must fail on a dump that never finished
        run: |
          docker compose exec -T postgres sh -c 'printf "#!/bin/sh\necho -- partial dump\n" > /usr/local/bin/pg_dump && chmod +x /usr/local/bin/pg_dump'
          before=$(ls backups | wc -l)
          if make backup; then
            docker compose exec -T postgres rm -f /usr/local/bin/pg_dump
            echo "::error::make backup accepted a dump with no completion marker"; exit 1
          fi
          docker compose exec -T postgres rm -f /usr/local/bin/pg_dump
          after=$(ls backups | wc -l)
          test "$before" = "$after" || { echo "::error::an incomplete make backup left a file behind"; exit 1; }
          echo "incomplete dump correctly rejected by make backup"

      - name: Stop the stack
        if: always()
        run: docker compose down -v
