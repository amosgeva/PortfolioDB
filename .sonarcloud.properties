# Read by SonarCloud automatic analysis (sonar-project.properties is for a CI
# scanner, which this repository does not run).
#
# The dashboard's app.js, app.css and fonts/fonts.css are generated by
# app/dashboard/static/build.mjs from sources that are analysed (src/,
# tokens.css), so for duplication they would count every line twice.
sonar.cpd.exclusions=app/dashboard/static/app.js,app/dashboard/static/app.css,app/dashboard/static/fonts/fonts.css,app/dashboard/static/tests/**
