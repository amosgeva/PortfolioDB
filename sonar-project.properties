# SonarCloud project configuration
# Docs: https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.organization=amosgeva
sonar.projectKey=amosgeva_PortfolioDB
sonar.projectName=PortfolioDB

# ---- Analysis scope ----
# Application code (Python + JS in app/) plus the repo tooling in tools/,
# which CI runs on every push (public-surface drift check, runner parity).
sonar.sources=app,tools

# Tell Sonar which folders are tests so production rules are skipped there
# and test-only rules run instead. Fixes the "'sonar.tests' is not configured"
# warning surfaced by SonarPython.
sonar.tests=app/tests,app/mcp/tests,tools/tests

# The test folders sit inside the source roots, so exclude them from the main
# set; a file matching both sources and tests fails the scan with
# "can't be indexed twice".
sonar.exclusions=app/tests/**,app/mcp/tests/**,tools/tests/**

# ---- Language settings ----
# CI and the production venv run 3.13; the app image (app/Dockerfile) is 3.14.
sonar.python.version=3.13, 3.14
sonar.sourceEncoding=UTF-8

# ---- Coverage (optional; wire up if/when you generate coverage.xml) ----
# sonar.python.coverage.reportPaths=coverage.xml
